name=source-connector-postgres-1
connector.class=io.debezium.connector.postgresql.PostgresConnector

# PostgreSQL Connection Settings
database.hostname=postgres-source-1
database.port=5432
database.user=postgres
database.password=postgres
database.dbname=postgres

# Logical Decoding Plugin
plugin.name=pgoutput

# Topic Prefix (Replaces database.server.name in Debezium 2.x+)
topic.prefix=postgres-source-1

# Tables to capture (Adjust schema and table names as needed)
table.include.list=public.users