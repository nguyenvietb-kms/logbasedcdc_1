name=sink-connector-snowflake-users-v3
connector.class=com.snowflake.kafka.connector.SnowflakeStreamingSinkConnector
tasks.max=1

# Source Kafka topic (matching Debezium CDC topic)
topics=postgres-source-1.public.users

# Snowflake Account & Connection Details
snowflake.url.name=GWEKWZX-CZ48845.snowflakecomputing.com
snowflake.user.name=dbt_service_user
snowflake.role.name=TRANSFORMER_DEV
snowflake.private.

# Target Snowflake Database & Schema
snowflake.database.name=ELS_SOURCE_SYSTEMS_DB_DEV
snowflake.schema.name=SRC_NHE_INSIGHTS

# Streaming Ingestion & Table Mapping
snowflake.ingestion.method=SNOWPIPE_STREAMING
snowflake.topic2table.map=postgres-source-1.public.users:users_raw

# Schematization & Compatibility Settings (KC v4 Fixes)
snowflake.enable.schematization=false
snowflake.streaming.validate.compatibility.with.classic=false

# Read all historical messages from beginning of the topic
consumer.override.auto.offset.reset=earliest

# Converters for key and value payloads
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false