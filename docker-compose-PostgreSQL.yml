version: '2'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"
    volumes: 
      - zoodata:/var/lib/zookeeper/data
      - zoolog:/var/lib/zookeeper/log

  kafka:
    image: nashtech/kafka:latest
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"
    volumes: 
      - kafkadata:/var/lib/kafka/data

  postgres-source-1:
    image: postgres:15-alpine
    container_name: postgres-source-1
    hostname: postgres-source-1
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"  # Changed host port from 5432 to 5435
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  postgres-source-2:
    image: postgres:15-alpine
    container_name: postgres-source-2
    hostname: postgres-source-2
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata2:/var/lib/postgresql/data

  postgres-sink:
    image: postgres:15-alpine
    container_name: postgres-sink
    hostname: postgres-sink-hostname
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata_sink:/var/lib/postgresql/data

volumes:
  zoodata:
  zoolog:
  kafkadata:
  pgdata:
  pgdata2:
  pgdata_sink: